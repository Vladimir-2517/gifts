<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подарок для ебанного скорпиона</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 40px 20px;
    color: #333;
  }

  header {
    text-align: center;
    color: #fff;
    margin-bottom: 40px;
  }

  header h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  }

  header p {
    font-size: 1.1rem;
    opacity: 0.9;
  }

  .filters {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 30px;
  }

  .filters button {
    padding: 10px 20px;
    border: 2px solid #fff;
    background: transparent;
    color: #fff;
    border-radius: 30px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.3s;
  }

  .filters button:hover,
  .filters button.active {
    background: #fff;
    color: #764ba2;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    transition: transform 0.3s, box-shadow 0.3s;
    display: flex;
    flex-direction: column;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
  }

  .card .emoji {
    font-size: 4rem;
    text-align: center;
    padding: 30px 20px 10px;
    background: linear-gradient(135deg, #f6f9ff 0%, #e9efff 100%);
  }

  .card .body {
    padding: 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .card h3 {
    font-size: 1.25rem;
    margin-bottom: 8px;
    color: #333;
  }

  .card .category {
    display: inline-block;
    font-size: 0.75rem;
    background: #ede9fe;
    color: #6d28d9;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
    align-self: flex-start;
  }

  .card p {
    font-size: 0.92rem;
    color: #666;
    line-height: 1.5;
    flex: 1;
  }

  .card .price {
    margin-top: 15px;
    font-size: 1.1rem;
    font-weight: bold;
    color: #764ba2;
  }

  .card .btn {
    display: block;
    margin-top: 15px;
    text-align: center;
    text-decoration: none;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    transition: opacity 0.3s, transform 0.2s;
  }

  .card .btn:hover {
    opacity: 0.9;
    transform: scale(1.02);
  }

  footer {
    text-align: center;
    color: #fff;
    margin-top: 50px;
    opacity: 0.8;
    font-size: 0.9rem;
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    color: #fff;
    font-size: 1.2rem;
    padding: 40px;
  }
</style>
</head>
<body>

<header>
  <h1>🦂 Подарок для ебанного скорпиона</h1>
  <p>Выбирай, чем задобрить Вову 🎁</p>
</header>

<div class="filters" id="filters">
  <button class="active" data-cat="all">Все</button>
  <button data-cat="tech">Техника</button>
  <button data-cat="accessories">Аксессуар</button>
  <button data-cat="hobby">Хобби</button>
  <button data-cat="experience">Впечатления</button>
</div>

<div class="grid" id="grid"></div>

<footer>Сделано с ❤️ специально для тебя</footer>

<script>
  const gifts = [
    {
      emoji: "🔦",
      title: "Фонарь-прожектор",
      category: "tech",
      desc: "Мощный свет для дома, дачи и походов. Пригодится в любой ситуации.",
      price: "от 1 957 ₽",
      link: "https://ozon.ru/t/a8fghK7"
    },
    {
      emoji: "🎒",
      title: "Рюкзак",
      category: "accessories",
      desc: "Вместительный рюкзак на каждый день — для учёбы, работы и поездок.",
      price: "от 6 999 ₽",
      link: "https://www.lamoda.ru/p/rtlaeo169001/bags-levis-ryukzak/"
    },
    {
      emoji: "🪒",
      title: "Триммер для бороды, волос и тела",
      category: "tech",
      desc: "Универсальный триммер: точная стрижка, уход за бородой и телом.",
      price: "от 7 719 ₽",
      link: "https://ozon.ru/t/2zNJKNy"
    },
    {
      emoji: "🎧",
      title: "Наушники с шумоподавлением",
      category: "tech",
      desc: "Погружение в музыку без лишних звуков. Идеально для работы и отдыха.",
      price: "от 13 452 ₽",
      link: "https://ozon.ru/t/4KbLf2q"
    },
    {
      emoji: "🖨",
      title: "3D-принтер Bambu Lab P2S Combo",
      category: "hobby",
      desc: "Печать собственных моделей дома. Отличный подарок для увлечённых.",
      price: "от 89 999 ₽",
      link: "https://bb-store.ru/3d-printery/3d-printer-bambu-lab-p2s-combo-s-ams/"
    },
    {
      emoji: "🏍",
      title: "Мотоцикл KTM 790 Duke",
      category: "experience",
      desc: "Настоящий адреналин и свобода дороги. Для тех, кто мечтает о мото.",
      price: "от 500 000 ₽",
      link: "https://auto.ru/motorcycle/used/sale/ktm/790_duke/1160212958-6a8e3984/"
    }
  ];

  gifts.sort((a, b) => priceValue(a.price) - priceValue(b.price));

  function priceValue(str) {
    return Number(String(str).replace(/[^\d]/g, '')) || 0;
  }

  const grid = document.getElementById('grid');
  const filters = document.getElementById('filters');

  function render(cat = 'all') {
    const filtered = cat === 'all' ? gifts : gifts.filter(g => g.category === cat);

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty">Пока ничего нет 😔</div>';
      return;
    }

    grid.innerHTML = filtered.map(g => `
      <div class="card">
        <div class="emoji">${g.emoji}</div>
        <div class="body">
          <span class="category">${labelOf(g.category)}</span>
          <h3>${g.title}</h3>
          <p>${g.desc}</p>
          <div class="price">${g.price}</div>
          <a class="btn" href="${g.link}" target="_blank" rel="noopener">Открыть →</a>
        </div>
      </div>
    `).join('');
  }

  function labelOf(cat) {
    const map = {
      tech: "Техника",
      accessories: "Аксессуар",
      hobby: "Хобби",
      experience: "Впечатления"
    };
    return map[cat] || cat;
  }

  filters.addEventListener('click', e => {
    if (e.target.tagName !== 'BUTTON') return;
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    render(e.target.dataset.cat);
  });

  render();
</script>
</body>
</html>
